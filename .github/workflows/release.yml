# Construit CorrigePro pour macOS (Intel + Apple Silicon) et Windows,
# puis publie une release GitHub quand on pousse un tag « v1.2.3 ».
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:renderer
      - name: Paquet Electron
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # pas de certificat de signature : désactive la recherche automatique
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: corrigepro-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: corrigepro-web
          path: dist-web/corrigepro.html

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: CorrigePro ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
